name: Curated Public Beta deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check approved artifact allowlist and reproduce current source build
        run: |
          python3 -B - <<'PY'
          import hashlib,json,subprocess,tempfile
          from pathlib import Path
          manifest=json.loads(Path('beta-release-manifest.json').read_text())
          assert manifest['schedules_enabled'] is manifest['email_enabled'] is manifest['automatic_publication_enabled'] is False
          assert set(p.name for p in Path('docs').iterdir())=={'index.html','opportunities.json','beta.css'}
          for path,expected in manifest['public_source_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,path
          for name,expected in manifest['build_sha256'].items():
              assert hashlib.sha256((Path('docs')/name).read_bytes()).hexdigest()==expected,name
          with tempfile.TemporaryDirectory() as folder:
              subprocess.run(['python3','00-自动化/build_curated_beta.py','--data','docs/opportunities.json','--output',folder],check=True)
              for name,expected in manifest['build_sha256'].items():
                  assert hashlib.sha256((Path(folder)/name).read_bytes()).hexdigest()==expected,name
          assert len(json.loads(Path('docs/opportunities.json').read_text())['opportunities'])==manifest['approved_count']>=5
          print('Current commit reproduced approved public artifacts; no collection, email or automatic publishing')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy curated Beta to existing Pages destination
        id: deployment
        uses: actions/deploy-pages@v4
